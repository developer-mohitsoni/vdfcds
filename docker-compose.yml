services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      WINDSIGHT_ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      WINDSIGHT_SNAPSHOT_PATH: /app/data/processed/january-2026.v1.json
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
